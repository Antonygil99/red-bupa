name: Actualizar directorio Bupa
on:
  schedule:
    # Primer día de cada mes, 07:17 en Mérida (UTC-6).
    - cron: '17 13 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bupa-directory-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run data:sync
      - run: npm test
      - run: npm run build
      - name: Publicar datos completos y comprobados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/directory.json public/data/directory.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualización mensual del directorio Bupa Mérida'
            git push
          fi
